apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datacommons.labels" . | nindent 4 }}
  annotations:
    kubernetes-engine.cloud.google.com/icon: >-
      data:image/svg+xml;base64,
    marketplace.cloud.google.com/deploy-info: '{}'
spec:
  descriptor:
    type: "Data Commons Accelerator"
    version: "{{ .Chart.AppVersion }}"
    description: |-
      Data Commons Accelerator - a ready-to-deploy instance of Custom Data Commons
      for exploring and visualizing structured data on GKE.

      **Features:**
      - Interactive data exploration and visualization
      - Integration with Google Cloud SQL for data storage
      - Scalable Kubernetes-native architecture
      - Support for custom data imports from GCS
      - Pre-built samples (Education, Health, Energy, Custom)
    links:
      - description: "Data Commons Documentation"
        url: "https://docs.datacommons.org/"
      - description: "Source Code"
        url: "https://github.com/datacommonsorg/website"
      - description: "User Guide"
        url: "https://docs.datacommons.org/custom_dc/"
    notes: |-
      # Getting Started

      Your Data Commons application has been deployed successfully!

      ## Next Steps

      1. **Configure Ingress**: Create an Ingress or Gateway API to expose the service:
      See [Exposing Apps](https://docs.cloud.google.com/kubernetes-engine/docs/how-to/exposing-apps) for more details.
         ```
         kubectl get service {{ include "datacommons.fullname" . }} -n {{ .Release.Namespace }}
         ```

      2. **Verify Database**: Check that the database initialization completed:
         ```
         kubectl get jobs -n {{ .Release.Namespace }}
         ```

      3. **Monitor Pods**: Ensure all pods are running:
         ```
         kubectl get pods -n {{ .Release.Namespace }}
         ```

      4. **View Logs**: Check application logs:
         ```
         kubectl logs -l app.kubernetes.io/name=datacommons -n {{ .Release.Namespace }}
         ```
  selector:
    matchLabels:
      {{- include "datacommons.selectorLabels" . | nindent 6 }}
  componentKinds:
    - group: apps/v1
      kind: Deployment
    - group: v1
      kind: Service
    - group: v1
      kind: ConfigMap
    - group: v1
      kind: ServiceAccount
    - group: batch/v1
      kind: Job
    {{- if .Values.dbSync.enabled }}
    - group: batch/v1
      kind: CronJob
    {{- end }}
  addOwnerRef: false
