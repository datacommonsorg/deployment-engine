{{- if .Values.dbInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "datacommons.fullname" . }}-db-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datacommons.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-init
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: {{ .Values.dbInit.ttlSecondsAfterFinished | default 3600 }}
  backoffLimit: {{ .Values.dbInit.backoffLimit | default 3 }}
  activeDeadlineSeconds: {{ .Values.dbInit.activeDeadlineSeconds | default 120 }}
  template:
    metadata:
      labels:
        {{- include "datacommons.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db-init
      annotations:
        # Checksum to ensure fresh config on each run
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "datacommons.serviceAccountName" . }}
      restartPolicy: Never

      containers:
        - name: db-init
          image: "{{ .Values.dbInit.image.repository }}:{{ .Values.dbInit.image.tag }}"
          imagePullPolicy: {{ .Values.dbInit.image.pullPolicy | default "IfNotPresent" }}
          # Environment variables from ConfigMap and Secrets
          envFrom:
            # Application configuration
            - configMapRef:
                name: {{ include "datacommons.fullname" . }}-config
            # Helm-generated admin credentials
            - secretRef:
                name: {{ include "datacommons.fullname" . }}
            {{- if .Values.existingSecret }}
            # Terraform-managed secrets (DB_PASS, DC_API_KEY, MAPS_API_KEY)
            - secretRef:
                  name: {{ .Values.existingSecret }}
            {{- end }}

          # Additional job-specific environment variables
          env:
            # Data run mode
            - name: DATA_RUN_MODE
              value: {{ .Values.dbInit.mode | quote }}
            # Input/Output directories
            - name: INPUT_DIR
              value: {{ include "datacommons.gcsInputDir" . | quote }}
            - name: OUTPUT_DIR
              value: {{ include "datacommons.gcsOutputDir" . | quote }}

          resources:
            {{- toYaml .Values.dbInit.resources | nindent 12 }}
{{- end }}
