apiVersion: v1
kind: Secret
metadata:
  name: {{ include "datacommons.fullname" . }}
  namespace: {{ include "datacommons.namespace" . }}
  labels:
    {{- include "datacommons.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-10"
type: Opaque
data:
  # Admin Panel Credentials
  {{- $existingSecret := lookup "v1" "Secret" (include "datacommons.namespace" .) (include "datacommons.fullname" .) }}
  {{- if $existingSecret }}
  # Preserve existing admin credentials on upgrade
  ADMIN_PANEL_USERNAME: {{ index $existingSecret.data "ADMIN_PANEL_USERNAME" }}
  ADMIN_PANEL_PASSWORD: {{ index $existingSecret.data "ADMIN_PANEL_PASSWORD" }}
  {{- else }}
  # Generate new admin credentials on first install
  ADMIN_PANEL_USERNAME: {{ "admin" | b64enc | quote }}
  ADMIN_PANEL_PASSWORD: {{ randAlphaNum 12 | b64enc | quote }}
  {{- end }}
