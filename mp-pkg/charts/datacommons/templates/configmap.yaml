apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "datacommons.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datacommons.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  # Data Commons API Configuration
  DC_API_ROOT: {{ .Values.config.dcApiRoot | quote }}
  WEBSITE_MIXER_API_ROOT: "http://localhost:8081"

  # CloudSQL Configuration
  {{- if .Values.config.cloudsql.enabled }}
  USE_CLOUDSQL: "true"
  CLOUDSQL_INSTANCE: {{ .Values.config.cloudsql.instance | quote }}
  CLOUDSQL_USE_PRIVATE_IP: {{ .Values.config.cloudsql.usePrivateIP | default "true" | quote }}
  DB_NAME: {{ .Values.config.cloudsql.database | quote }}
  DB_USER: {{ .Values.config.cloudsql.user | quote }}
  {{- end }}

  # GCS Configuration
  {{- if .Values.config.gcs.bucket }}
  OUTPUT_DIR: {{ include "datacommons.gcsOutputDir" . | quote }}
  INPUT_DIR: {{ include "datacommons.gcsInputDir" . | quote }}
  {{- end }}

  # Natural Language / Model Configuration
  ENABLE_MODEL: {{ .Values.config.enableNaturalLanguage | quote }}
  {{- if not .Values.config.enableNaturalLanguage }}
  NL_DISASTER_CONFIG: ""
  NL_FULFILLMENT_CONFIG: ""
  {{- end }}

  # GCP Project
  {{- if .Values.global.projectId }}
  GCP_PROJECT_ID: {{ .Values.global.projectId | quote }}
  {{- end }}

  # Domain Template
  FLASK_ENV: {{ .Values.config.flaskEnv | quote }}

  # Mixer Settings
  {{- if .Values.config.gomaxprocs }}
  GOMAXPROCS: {{ .Values.config.gomaxprocs | quote }}
  {{- end }}
  {{- if .Values.config.maxConnections }}
  MAX_CONNECTIONS: {{ .Values.config.maxConnections | quote }}
  {{- end }}

  # Debug Settings
  {{- if .Values.config.debug }}
  DEBUG: "true"
  {{- end }}
  {{- if .Values.config.enableAdmin }}
  ENABLE_ADMIN: "true"
  {{- end }}

  {{- with .Values.config.extraEnv }}
  # Additional environment variables
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
