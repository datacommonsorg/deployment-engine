# ============================================
# Global Settings
# ============================================
global:
  # GCP Project ID (injected by Terraform)
  projectId: ""

# ============================================
# Deployment Configuration
# ============================================
deployment:
  replicas: 1

  # Container image (injected by Terraform)
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

  # Resource limits
  resources:
    requests:
      memory: "4Gi"
      cpu: "2"
    limits:
      memory: "4Gi"
      cpu: "2"

  # Health probes
  probes:
    startup:
      enabled: true
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30
    readiness:
      enabled: true
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      enabled: true
      initialDelaySeconds: 120
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3

  # Pod security context
  securityContext:
    fsGroup: 1000

  # Container security context
  containerSecurityContext: {}

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity
  affinity: {}

  # Additional pod annotations
  podAnnotations: {}

  # Additional pod labels
  podLabels: {}

# ============================================
# Database Initialization Job
# ============================================
dbInit:
  enabled: true

  # Data container image (injected by Terraform)
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

  # Run mode: "schemaupdate" for schema creation only
  mode: "schemaupdate"

  # Job settings
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  activeDeadlineSeconds: 600

  # Resource limits
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

# ============================================
# Database Sync CronJob
# ============================================
dbSync:
  enabled: true

  # Cron schedule (default: every 3 hours)
  schedule: "0 */3 * * *"

  # Data container image (injected by Terraform)
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

  # Run mode: "customdc" for data import. But should be left empty to enable it.
  mode: ""

  # CronJob settings
  concurrencyPolicy: "Forbid"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3

  # Resource limits
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

# ============================================
# Application Configuration
# ============================================
config:
  # Enable Natural Language features
  enableNaturalLanguage: true

  # Enable periodic data sync
  enableDataSync: true

  # Domain template (FLASK_ENV)
  flaskEnv: "custom"

  # Data Commons API root
  dcApiRoot: "https://api.datacommons.org"

  # CloudSQL configuration (injected by Terraform)
  cloudsql:
    enabled: true
    # Instance connection name: project:region:instance
    instance: ""
    # Database name
    database: "datacommons"
    # Database user
    user: "datacommons"
    # Use private IP connection
    usePrivateIP: true

  # GCS configuration (injected by Terraform)
  gcs:
    # Base bucket URL
    bucket: ""
    # Optional path prefix within bucket
    pathPrefix: ""

  # Mixer settings
  gomaxprocs: 50
  maxConnections: 100

  # Debug settings
  debug: false
  enableAdmin: false

  # Additional environment variables
  extraEnv: {}

# ============================================
# Service Account (Workload Identity)
# ============================================
serviceAccount:
  create: true
  # K8s ServiceAccount name
  name: "datacommons-ksa"
  # GCP Service Account email (injected by Terraform)
  gcpServiceAccountEmail: ""
  # Additional annotations
  annotations: {}

# ============================================
# Secrets Configuration
# ============================================
# Secrets are created by Terraform and referenced here
# The chart does NOT create secrets - only references them
existingSecret: "datacommons-secrets"


# ============================================
# Service Configuration
# ============================================
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}
