# GCP Marketplace Image Mapping Schema
# ============================================

images:
  cdc-services:
    variables:
      cdc_services_image_repo:
        type: REPO_WITH_REGISTRY_WITH_NAME
      cdc_services_image_tag:
        type: TAG
  data:
    variables:
      data_image_repo:
        type: REPO_WITH_REGISTRY_WITH_NAME
      data_image_tag:
        type: TAG
