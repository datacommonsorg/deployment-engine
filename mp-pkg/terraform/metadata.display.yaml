apiVersion: blueprints.cloud.google.com/v1alpha1
kind: BlueprintMetadata
metadata:
  name: datacommons-marketplace-display
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  info:
    title: Data Commons Accelerator
    source: {}
  ui:
    input:
      variables:
        goog_cm_deployment_name:
          name: goog_cm_deployment_name
          title: Deployment Name
          tooltip: Name for this deployment (2-18 characters)
          placeholder: dc
          validation: ^[a-z][a-z0-9-]{0,16}[a-z0-9]$
        create_new_cluster:
          name: create_new_cluster
          title: Create New GKE Cluster
          invisible: true
          # To enable Create/Existing cluster toggle, uncomment below and remove invisible:
          # tooltip: Choose whether to create a new GKE Autopilot cluster or use an existing one.
          # xGoogleProperty:
          #   type: ET_CREATE_RESOURCE
        region:
          name: region
          title: GCP Region
          tooltip: GCP region where the cluster and cloud resources will be created.
          xGoogleProperty:
            type: ET_GCE_REGION
        gke_cluster_name:
          name: gke_cluster_name
          title: GKE Cluster Name
          invisible: true
          # To enable cluster picker, uncomment below and remove invisible:
          # tooltip: Select your existing GKE cluster for deployment
          # section: cluster
          # xGoogleProperty:
          #   type: ET_GKE_CLUSTER
          #   gkeCluster:
          #     locationVariable: gke_cluster_location
          #     clusterCreationVariable: create_new_cluster
        resource_tier:
          name: resource_tier
          title: Resource Tier
          tooltip: |
            Resource allocation for the deployment. Controls both application pod sizing and database tier.
            Small:  App 2Gi/1CPU, DB Standard-1 (dev/test)
            Medium: App 4Gi/2CPU, DB Standard-2
            Large:  App 8Gi/4CPU, DB Standard-4
          section: application
          enumValueLabels:
            - label: Small - 2Gi RAM, 1 CPU
              value: small
            - label: Medium - 4Gi RAM, 2 CPU (recommended)
              value: medium
            - label: Large - 8Gi RAM, 4 CPU
              value: large
        flask_env:
          name: flask_env
          title: Domain Template
          tooltip: |
            Select a pre-built Data Commons configuration optimized for a specific domain.
            Each domain includes curated datasets, statistical variables, and visualizations tailored to that subject area.
            Select the domain that best matches your use case.
          placeholder: Choose from the list
          section: application
          enumValueLabels:
            - label: Education
              value: education
            - label: Health
              value: health
            - label: Energy
              value: energy
        dc_api_key:
          name: dc_api_key
          title: Data Commons API Key
          tooltip: |
            API key for Data Commons API access.
            Get yours at: https://docs.datacommons.org/custom_dc/quickstart.html#get-a-data-commons-api-key
          placeholder: "..."
          section: api
          validation: ^[A-Za-z0-9_-]+$
        gke_cluster_location:
          name: gke_cluster_location
          title: GKE Cluster Location
          invisible: true
          # To enable location picker, uncomment below and remove invisible:
          # xGoogleProperty:
          #   type: ET_GCE_LOCATION
        project_id:
          name: project_id
          title: Project ID
          invisible: true
        create_namespace:
          name: create_namespace
          title: Create Namespace
          invisible: true
        namespace:
          name: namespace
          title: Kubernetes Namespace
          invisible: true
        app_replicas:
          name: app_replicas
          title: Application Replicas
          invisible: true
        enable_natural_language:
          name: enable_natural_language
          title: Enable Natural Language Queries
          invisible: true
        enable_data_sync:
          name: enable_data_sync
          title: Enable Custom Data Sync
          invisible: true
        cloudsql_instance_name_override:
          name: cloudsql_instance_name_override
          title: CloudSQL Instance Name Override
          invisible: true
        gcs_bucket_name_override:
          name: gcs_bucket_name_override
          title: GCS Bucket Name Override
          invisible: true
        service_account_name_override:
          name: service_account_name_override
          title: Service Account Name Override
          invisible: true
        cdc_services_image_repo:
          name: cdc_services_image_repo
          title: CDC Services Image Repository
          invisible: true
        cdc_services_image_tag:
          name: cdc_services_image_tag
          title: CDC Services Image Tag
          invisible: true
        data_image_repo:
          name: data_image_repo
          title: Data Image Repository
          invisible: true
        data_image_tag:
          name: data_image_tag
          title: Data Image Tag
          invisible: true
        helm_chart_repo:
          name: helm_chart_repo
          title: Helm Chart Repository
          invisible: true
        helm_chart_name:
          name: helm_chart_name
          title: Helm Chart Name
          invisible: true
        helm_chart_version:
          name: helm_chart_version
          title: Helm Chart Version
          invisible: true
      sections:
        - name: application
          title: Application Settings
          tooltip: Data Commons Accelerator application configuration and resource allocation
        - name: api
          title: API Keys
          tooltip: API keys required for Data Commons and Google Maps integration
